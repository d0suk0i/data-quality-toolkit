[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-quality-toolkit"
version = "1.0.0"
description = "A lightweight CSV and Excel data-quality validation toolkit."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Garret Stevens" }
]
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "PyYAML>=6.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0"
]

[project.scripts]
data-quality = "data_quality_toolkit.cli:main"

[project.urls]
Repository = "https://github.com/d0suk0i/data-quality-toolkit"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]